# Đường hầm HTTPS (ngrok, Cloudflare) gửi X-Forwarded-Proto: https nhưng thường không gửi X-Forwarded-Port.
# Khi đó iTop (behind_reverse_proxy = true) lấy cổng nội bộ 80 và dựng link hỏng dạng https://<tên miền>:80/.
# Thêm cổng 443 nếu request đến qua HTTPS mà proxy chưa ghi cổng.
RequestHeader setifempty X-Forwarded-Port "443" "expr=%{req:X-Forwarded-Proto} == 'https'"
