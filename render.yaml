# Render Blueprint: một web service miễn phí chạy cả bộ giả lập và BMS (npm start).
# Chỉ cổng web của BMS mở ra internet; Modbus (5020) và API sự cố (5021) nằm nội bộ trong container.
services:
  - type: web
    name: bms-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: SIM_PROXY
        value: "1"
      - key: BASIC_AUTH_USER
        value: demo
      - key: BASIC_AUTH_PASSWORD
        sync: false # Render hỏi giá trị khi tạo Blueprint; không lưu mật khẩu trong repo
      # ITSM (tùy chọn): iTop chạy ở máy riêng, mở ra qua đường hầm (itsm/tunnel.sh).
      # Để trống ITSM_ENABLED hoặc ITSM_PASSWORD thì ITSM tắt, demo chạy như cũ.
      - key: ITSM_ENABLED
        sync: false # đặt 1 để bật
      - key: ITSM_URL
        sync: false # địa chỉ đường hầm do itsm/tunnel.sh in ra; đổi mỗi lần bật lại đường hầm
      - key: ITSM_USER
        value: bms-itsm
      - key: ITSM_PASSWORD
        sync: false
      - key: ITSM_WARNING_HOLD_SEC
        value: "30"
      # DCIM (tùy chọn): NetBox chạy ở máy riêng, đi chung đường hầm với iTop ở đường dẫn /netbox/.
      # Để trống DCIM_API_KEY thì tab Dung lượng dùng config/dcim.json.
      - key: NETBOX_URL
        sync: false # <địa chỉ đường hầm>/netbox/, do itsm/tunnel.sh in ra
      - key: DCIM_API_KEY
        sync: false # giá trị trong dcim/.env
      - key: DCIM_API_TOKEN
        sync: false # giá trị trong dcim/.env
